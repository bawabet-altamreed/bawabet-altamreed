<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>دخول الإدارة | بوابة التمريض</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f7fb;
}

.admin-login-card {
    width: 90%;
    max-width: 430px;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    text-align: center;
}

.admin-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.admin-login-card h1 {
    margin-bottom: 8px;
    color: #0d47a1;
}

.admin-login-card p {
    color: #666;
    margin-bottom: 25px;
}

.input-group {
    text-align: right;
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
}

.login-btn {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 10px;
    background: #1976d2;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.error-message {
    color: #d32f2f;
    margin-top: 15px;
    min-height: 20px;
    line-height: 1.6;
}

</style>

</head>

<body>


<div class="admin-login-card">

    <div class="admin-icon">
        👑
    </div>

    <h1>
        لوحة الإدارة
    </h1>

    <p>
        تسجيل دخول إدارة بوابة التمريض
    </p>


    <div class="input-group">

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            autocomplete="username">

    </div>


    <div class="input-group">

        <label for="password">
            كلمة المرور
        </label>

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password">

    </div>


    <button
        id="loginBtn"
        class="login-btn"
        type="button">

        🔐 دخول لوحة الإدارة

    </button>


    <div
        id="errorMessage"
        class="error-message">
    </div>

</div>


<!-- =====================================
     Firebase
===================================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

const ADMIN_UID =
    "4TbambkNbZUvsoc95q0cdy15fGn1";


const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const errorMessage =
    document.getElementById("errorMessage");


// ==========================================
// التحقق من وجود جلسة أدمن بالفعل
// ==========================================

firebase.auth().onAuthStateChanged(
    function(user) {

        if (
            user &&
            user.uid === ADMIN_UID
        ) {

            window.location.replace(
                "admin.html"
            );

        }

    }
);


// ==========================================
// تسجيل دخول الأدمن
// ==========================================

function adminLogin() {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    // تنظيف الرسالة

    errorMessage.textContent = "";


    // ==================================
    // التحقق من البيانات
    // ==================================

    if (!email || !password) {

        errorMessage.textContent =
            "⚠️ من فضلك أدخل البريد الإلكتروني وكلمة المرور";

        return;

    }


    // ==================================
    // تعطيل الزر
    // ==================================

    loginBtn.disabled = true;

    loginBtn.textContent =
        "⏳ جاري تسجيل الدخول...";


    // ==================================
    // Firebase Login
    // ==================================

    firebase.auth()
        .signInWithEmailAndPassword(
            email,
            password
        )


        // ==================================
        // نجاح تسجيل الدخول
        // ==================================

        .then(function(result) {

            const user =
                result.user;


            console.log(
                "Admin Login UID:",
                user.uid
            );


            // ==================================
            // التحقق من UID الأدمن
            // ==================================

            if (
                user.uid !== ADMIN_UID
            ) {

                return firebase.auth()
                    .signOut()

                    .then(function() {

                        throw new Error(
                            "هذا الحساب ليس حساب مدير النظام"
                        );

                    });

            }


            // ==================================
            // الحساب صحيح
            // ==================================

            window.location.replace(
                "admin.html"
            );

        })


        // ==================================
        // معالجة الأخطاء
        // ==================================

        .catch(function(error) {

            console.error(
                "Admin Login Error:",
                error
            );


            // إظهار الخطأ الحقيقي من Firebase

            let message =
                error.code +
                " — " +
                error.message;


            // محاولات كثيرة

            if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "⚠️ تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقًا.";

            }


            // ==================================
            // عرض الخطأ
            // ==================================

            errorMessage.textContent =
                message;


            // ==================================
            // إعادة تفعيل الزر
            // ==================================

            loginBtn.disabled = false;

            loginBtn.textContent =
                "🔐 دخول لوحة الإدارة";

        });

}


// ==========================================
// زر تسجيل الدخول
// ==========================================

loginBtn.addEventListener(
    "click",
    adminLogin
);


// ==========================================
// الضغط على Enter
// ==========================================

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            adminLogin();

        }

    }
);

</script>

</body>

</html>
