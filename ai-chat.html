<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مساعد بوابة التمريض</title>

    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ai-chat.css">

</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="chat-header">

        <div class="header-right">

            <div class="ai-avatar">
                🤖
            </div>

            <div>

                <h1>
                    مساعد بوابة التمريض
                </h1>

                <span class="online-status">
                    ● متصل الآن
                </span>

            </div>

        </div>


        <button
            id="newChatBtn"
            class="new-chat-btn"
            type="button">

            ＋ محادثة جديدة

        </button>

    </header>


    <!-- ==========================================
         CHAT
    =========================================== -->

    <main class="chat-container">


        <!-- ======================================
             DAILY AI LIMIT
        ======================================= -->

        <div
            id="dailyLimitCard"
            class="daily-limit-card">

            <div class="daily-limit-top">

                <div class="daily-limit-title">

                    <span class="daily-limit-icon">
                        🤖
                    </span>

                    <div>

                        <strong>
                            أسئلة الذكاء الاصطناعي
                        </strong>

                        <small>
                            الحد المجاني اليومي
                        </small>

                    </div>

                </div>


                <div
                    id="dailyLimitNumber"
                    class="daily-limit-number">

                    10 / 10

                </div>

            </div>


            <div class="daily-progress">

                <div
                    id="dailyProgressBar"
                    class="daily-progress-bar">

                </div>

            </div>


            <div class="daily-limit-bottom">

                <span id="dailyLimitText">
                    متبقي 10 أسئلة اليوم
                </span>

                <span>
                    يتجدد يوميًا 🔄
                </span>

            </div>

        </div>


        <!-- ======================================
             MESSAGES
        ======================================= -->

        <section
            id="chatMessages"
            class="chat-messages">

            <!-- Welcome -->

            <div class="welcome-message">

                <div class="welcome-icon">
                    🩺
                </div>

                <h2>
                    أهلاً بيك في مساعد بوابة التمريض 👋
                </h2>

                <p>
                    أنا هنا أساعدك في المذاكرة،
                    الشرح، المراجعة وحل الأسئلة.
                </p>


                <div class="suggestions">

                    <button
                        type="button"
                        class="suggestion-btn">

                        📚 اشرحلي درس بطريقة بسيطة

                    </button>

                    <button
                        type="button"
                        class="suggestion-btn">

                        📝 اعمللي أسئلة للمراجعة

                    </button>

                    <button
                        type="button"
                        class="suggestion-btn">

                        🧠 اختبرني في المعلومات الطبية

                    </button>

                </div>

            </div>

        </section>


        <!-- ======================================
             TYPING
        ======================================= -->

        <div
            id="typingIndicator"
            class="typing-indicator hidden">

            <div class="message-avatar">
                🤖
            </div>

            <div class="typing-bubble">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>


        <!-- ======================================
             INPUT
        ======================================= -->

        <div class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    placeholder="اكتب سؤالك هنا..."
                    rows="1"
                    maxlength="4000"></textarea>


                <button
                    id="sendBtn"
                    class="send-btn"
                    type="button"
                    aria-label="إرسال">

                    ➤

                </button>

            </div>


            <div class="input-footer">

                <span>
                    مساعد تعليمي لطلاب التمريض
                </span>

                <span id="charCount">
                    0 / 4000
                </span>

            </div>

        </div>

    </main>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="ai-chat.js"></script>

</body>

</html>
