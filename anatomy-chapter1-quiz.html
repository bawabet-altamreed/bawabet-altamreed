<p>

<!-- ========================================== -->

<section class="years">

<div class="card">

⏳ <span id="timer">10:00</span>

</div>

<!-- Answers -->

<!-- ========================================== -->
<!-- Next Button -->
<!-- ========================================== -->

<button id="nextBtn">

▶️ التالي

</button>


</div>

</section>



<script>


// ==================================================
// بوابة التمريض
// Anatomy - Chapter 1 Quiz
// ==================================================


// ==================================================
// Firebase Authentication
// ==================================================

let currentUser = null;


// ==================================================
// منع حفظ النتيجة أكثر من مرة
// ==================================================

let examFinished = false;


// ==================================================
// التحقق من تسجيل الدخول
// ==================================================

firebase.auth().onAuthStateChanged(function(user){

    if(user){

        currentUser = user;

        console.log(
            "Logged in:",
            user.email
        );

    }

    else{

        window.location.replace(
            "login.html"
        );

    }

});



// ==================================================
// الأسئلة
// ==================================================

const questions = [

{
question:
"Which of the following is classified as a Long Bone?",

answers:[
{text:"Humerus",correct:true},
{text:"Scapula",correct:false},
{text:"Vertebra",correct:false},
{text:"Carpal bone",correct:false}
]
},


{
question:
"Which of the following is an example of a Short Bone?",

answers:[
{text:"Femur",correct:false},
{text:"Carpal bone",correct:true},
{text:"Sternum",correct:false},
{text:"Humerus",correct:false}
]
},


{
question:
"Vertebrae are classified as:",

answers:[
{text:"Flat bones",correct:false},
{text:"Pneumatic bones",correct:false},
{text:"Irregular bones",correct:true},
{text:"Sesamoid bones",correct:false}
]
},


{
question:
"Which of the following is an example of a Sesamoid Bone?",

answers:[
{text:"Patella",correct:true},
{text:"Femur",correct:false},
{text:"Scapula",correct:false},
{text:"Radius",correct:false}
]
},


{
question:
"Pneumatic bones contain air-filled spaces known as:",

answers:[
{text:"Fontanelles",correct:false},
{text:"Foramina",correct:false},
{text:"Paranasal Sinuses",correct:true},
{text:"Sutures",correct:false}
]
},


{
question:
"The skeleton is divided into:",

answers:[
{text:"Cranial and facial skeleton",correct:false},
{text:"Axial and appendicular skeleton",correct:true},
{text:"Upper and lower skeleton only",correct:false},
{text:"Thoracic and pelvic skeleton",correct:false}
]
},


{
question:
"Which of the following belongs to the Axial Skeleton?",

answers:[
{text:"Femur",correct:false},
{text:"Humerus",correct:false},
{text:"Skull",correct:true},
{text:"Radius",correct:false}
]
},


{
question:
"How many bones are normally present in the adult skull?",

answers:[
{text:"18 bones",correct:false},
{text:"20 bones",correct:false},
{text:"22 bones",correct:true},
{text:"24 bones",correct:false}
]
},


{
question:
"Which of the following is a paired bone of the skull?",

answers:[
{text:"Frontal bone",correct:false},
{text:"Occipital bone",correct:false},
{text:"Parietal bone",correct:true},
{text:"Mandible",correct:false}
]
},


{
question:
"A fracture of the skull base may cause:",

answers:[
{text:"Bleeding from the nose or ears",correct:true},
{text:"Increased appetite",correct:false},
{text:"Improved hearing",correct:false},
{text:"Pain only in the foot",correct:false}
]
},


{
question:
"The soft membranous areas between the skull bones of a newborn are called:",

answers:[
{text:"Sutures",correct:false},
{text:"Fontanelles",correct:true},
{text:"Foramina",correct:false},
{text:"Sinuses",correct:false}
]
},


{
question:
"Which statement about the Anterior Fontanelle is correct?",

answers:[
{text:"It is small and triangular",correct:false},
{text:"It closes within 3 months",correct:false},
{text:"It is large and diamond-shaped",correct:true},
{text:"It is located in the lower limb",correct:false}
]
},


{
question:
"The Radius is located on which side of the forearm?",

answers:[

]

{

answers:[

]

{
question:
"How many Carpal Bones are present in one hand?",

answers:[

{
question:
"Which is the longest and strongest bone in the human body?",

answers:[

{text:"Fibula",correct:false}
]
},


{
question:
"The Tibia is located on the:",

answers:[
{text:"Lateral side of the leg",correct:false},
{text:"Medial side of the leg",correct:true},
{text:"Lateral side of the forearm",correct:false},
{text:"Posterior side of the arm",correct:false}
]
},


{
question:
"Which ribs are known as Floating Ribs?",

answers:[
{text:"Ribs 1–7",correct:false},

{text:"Ribs 10–11",correct:false},
{text:"Ribs 11–12",correct:true}
]
},


{
question:
"How many Thoracic Vertebrae are present?",

answers:[
{text:"5",correct:false},

{text:"14",correct:false}
]
},


{
question:
"Which of the following is a normal curve of the vertebral column?",

answers:[

{text:"Femoral Lordosis",correct:false},

]

{

"Which structure does the vertebral column protect?",

answers:[
{text:"Spinal cord",correct:true},

{text:"Patella",correct:false},
{text:"Carpal bones",correct:false}
]
},


{
question:
"Which statement correctly describes the Female Pelvis?",

answers:[
{text:"Narrow outlet and narrow pubic arch",correct:false},
{text:"Heart-shaped inlet",correct:false},
{text:"Wide inlet and wide outlet",correct:true},
{text:"Long and narrow sacrum",correct:false}
]
},


{
question:
"How many Phalanges are present in one hand?",

answers:[
{text:"8",correct:false},
{text:"10",correct:false},
{text:"12",correct:false},
{text:"14",correct:true}
]
},


{
question:
"How many Tarsal Bones are present in one foot?",

answers:[
{text:"5",correct:false},
{text:"7",correct:true},
{text:"8",correct:false},
{text:"14",correct:false}
]
}

];



// ==================================================
// متغيرات الاختبار
// ==================================================

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = 600;

let timerInterval = null;



// ==================================================
// عناصر الصفحة
// ==================================================

const questionElement =
document.getElementById("question");


const answersElement =
document.getElementById("answers");


const nextButton =
document.getElementById("nextBtn");


const progressBar =
document.getElementById("progressBar");


const timerElement =
document.getElementById("timer");



// ==================================================
// عرض السؤال
// ==================================================

function showQuestion(){

    if(examFinished) return;


    answered = false;


    answersElement.innerHTML = "";


    nextButton.style.display =
    "none";


    const q =
    questions[currentQuestion];


    questionElement.innerHTML =
    (currentQuestion + 1) +
    ". " +
    q.question;


    progressBar.style.width =
    (
        ((currentQuestion + 1) /
        questions.length) * 100
    ) + "%";


    document.title =
    "Anatomy Quiz - Question " +
    (currentQuestion + 1);


    q.answers.forEach(function(answer){

        const button =
        document.createElement("button");


        button.type =
        "button";


        button.innerHTML =
        answer.text;


        button.className =
        "quiz-answer";


        button.onclick =
        function(){

            selectAnswer(
                answer.correct,
                button
            );

        };


        answersElement.appendChild(
            button
        );

    });

}



// ==================================================
// اختيار الإجابة
// ==================================================

function selectAnswer(correct, button){

    if(answered || examFinished)
        return;


    answered = true;


    const buttons =
    Array.from(
        answersElement.children
    );


    buttons.forEach(function(btn){

        btn.disabled = true;

    });


    if(correct){

        score++;


        button.style.background =
        "green";


        button.style.color =
        "#fff";

    }

    else{

        button.style.background =
        "red";


        button.style.color =
        "#fff";


        const correctIndex =
        questions[currentQuestion]
        .answers
        .findIndex(function(answer){

            return answer.correct === true;

        });


        if(correctIndex !== -1){

            buttons[
                correctIndex
            ].style.background =
            "green";


            buttons[
                correctIndex
            ].style.color =
            "#fff";

        }

    }


    nextButton.style.display =
    "block";

}



// ==================================================
// زر التالي
// ==================================================

nextButton.onclick =
function(){

    if(examFinished)
        return;


    if(!answered){

        alert(
            "من فضلك اختر إجابة أولاً"
        );

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        showQuestion();

    }

    else{

        finishExam();

    }

};



// ==================================================
// إنهاء الاختبار
// ==================================================

function finishExam(){

    if(examFinished)
        return;


    examFinished = true;


    clearInterval(
        timerInterval
    );


    const percentage =
    Math.round(
        (score /
        questions.length) * 100
    );


    disableQuiz();


    saveResult(
        percentage
    );

}



// ==================================================
// إنهاء الاختبار بسبب انتهاء الوقت
// ==================================================

function timeUp(){

    if(examFinished)
        return;


    examFinished = true;


    clearInterval(
        timerInterval
    );


    const percentage =
    Math.round(
        (score /
        questions.length) * 100
    );


    disableQuiz();


    alert(
        "⏰ انتهى الوقت!"
    );


    saveResult(
        percentage
    );

}



// ==================================================
// تعطيل الاختبار
// ==================================================

function disableQuiz(){

    const buttons =
    answersElement.querySelectorAll(
        "button"
    );


    buttons.forEach(function(button){

        button.disabled = true;

    });


    nextButton.disabled = true;

}



// ==================================================
// حفظ النتيجة في Firebase
// ==================================================

function saveResult(percentage){

    if(!currentUser){

        showResult(
            percentage
        );

        return;

    }


    db.collection("users")

    .doc(currentUser.uid)

    .get()

    .then(function(doc){

        if(!doc.exists){

            throw new Error(
                "بيانات الطالب غير موجودة"
            );

        }


        const userData =
        doc.data();


        return db.collection("results")

        .add({

            uid:
            currentUser.uid,

            studentCode:
            userData.studentCode || "",

            name:
            userData.name || "",

            grade:
            userData.grade || "",

            email:
            currentUser.email || "",

            subject:
            "Anatomy",

            chapter:
            "Chapter 1",

            score:
            score,

            total:
            questions.length,

            percentage:
            percentage,

            date:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        });

    })

    .then(function(){

        showResult(
            percentage
        );

    })

    .catch(function(error){

        console.error(
            "Save Result Error:",
            error
        );


        alert(
            "❌ حدث خطأ أثناء حفظ النتيجة، ولكن سيتم عرض النتيجة."
        );


        showResult(
            percentage
        );

    });

}



// ==================================================
// عرض النتيجة
// ==================================================

function showResult(percentage){

    questionElement.innerHTML =
    "🎉 انتهى الاختبار";


    progressBar.style.width =
    "100%";


    let message;


    if(percentage >= 90){

        message =
        "🏆 ممتاز! أداء رائع في Anatomy.";

    }

    else if(percentage >= 75){

        message =
        "👏 أحسنت! مستواك جيد جدًا.";

    }

    else if(percentage >= 50){

        message =
        "👍 جيد، لكن راجع الشابتر مرة أخرى.";

    }

    else{

        message =
        "📚 تحتاج إلى مراجعة Chapter 1 ثم إعادة الاختبار.";

    }


    answersElement.innerHTML = `

        <div class="result-box">

            <p>النتيجة</p>

            <h1>
                ${score} / ${questions.length}
            </h1>

            <h2>
                ${percentage}%
            </h2>

            <p>
                ${message}
            </p>


            <button
            type="button"
            onclick="location.reload()">

                🔄 إعادة الاختبار

            </button>


            <br><br>


            <button
            type="button"
            onclick="location.href='anatomy-chapter1.html'">

                🦴 العودة للشابتر

            </button>

        </div>

    `;


    nextButton.style.display =
    "none";

}



// ==================================================
// المؤقت
// ==================================================

function updateTimer(){

    const minutes =
    Math.floor(
        timeLeft / 60
    );


    const seconds =
    timeLeft % 60;


    const formattedSeconds =
    seconds < 10
    ? "0" + seconds
    : seconds;


    timerElement.innerHTML =
    "⏱️ الوقت: " +
    minutes +
    ":" +
    formattedSeconds;

}



// ==================================================
// تشغيل المؤقت
// ==================================================

function startTimer(){

    updateTimer();


    timerInterval =
    setInterval(function(){

        if(examFinished){

            clearInterval(
                timerInterval
            );

            return;

        }


        timeLeft--;


        if(timeLeft <= 0){

            timeLeft = 0;


            updateTimer();


            timeUp();


            return;

        }


        updateTimer();

    },1000);

}



// ==================================================
// تشغيل الاختبار
// ==================================================

showQuestion();

startTimer();


</script>

<!-- Authentication -->
<!-- ========================================== -->
