<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>شهادة | بوابة التمريض</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background:
        #eef2f7;

    color:
        #222;

}

.page {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px;

}

.certificate {

    width: 100%;

    max-width: 950px;

    background: white;

    border: 12px solid #0d47a1;

    padding: 55px;

    text-align: center;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.15);

    position: relative;

}

.logo {

    font-size: 28px;

    font-weight: bold;

    color: #0d47a1;

    margin-bottom: 25px;

}

.title {

    font-size: 42px;

    color: #0d47a1;

    margin: 15px 0;

}

.subtitle {

    font-size: 20px;

    color: #666;

}

.student-name {

    font-size: 36px;

    font-weight: bold;

    margin: 30px 0;

    color: #111;

}

.course {

    font-size: 25px;

    font-weight: bold;

    color: #1976d2;

    margin: 20px 0;

}

.score {

    font-size: 22px;

    margin: 20px 0;

}

.details {

    display: flex;

    justify-content: space-between;

    gap: 20px;

    margin-top: 45px;

    font-size: 14px;

    color: #555;

}

.verify {

    margin-top: 35px;

    font-size: 13px;

    color: #777;

}

.status {

    font-weight: bold;

    margin-top: 15px;

}

.valid {

    color: #2e7d32;

}

.invalid {

    color: #d32f2f;

}

.actions {

    margin-top: 25px;

    text-align: center;

}

button {

    border: none;

    padding: 12px 25px;

    border-radius: 10px;

    background: #0d47a1;

    color: white;

    cursor: pointer;

    font-size: 16px;

}

@media print {

    body {

        background: white;

    }

    .page {

        padding: 0;

    }

    .certificate {

        box-shadow: none;

        max-width: none;

    }

    .actions {

        display: none;

    }

}

@media (max-width: 600px) {

    .certificate {

        padding: 30px 18px;

        border-width: 7px;

    }

    .title {

        font-size: 30px;

    }

    .student-name {

        font-size: 26px;

    }

    .course {

        font-size: 20px;

    }

    .details {

        flex-direction: column;

    }

}

</style>

</head>

<body>

<div class="page">

    <div
        id="certificate"
        class="certificate">

        ⏳ جاري تحميل الشهادة...

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const certificateId =
    params.get("id");


const container =
    document.getElementById(
        "certificate"
    );


function escapeHtml(value) {

    return String(
        value ?? ""
    )

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function getDate(value) {

    if (!value) {
        return null;
    }

    if (
        typeof value.toDate ===
        "function"
    ) {

        return value.toDate();

    }

    const date =
        new Date(value);

    return isNaN(
        date.getTime()
    )
        ? null
        : date;

}


function formatDate(value) {

    const date =
        getDate(value);

    if (!date) {
        return "-";
    }

    return date.toLocaleDateString(
        "ar-EG",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


function loadCertificate() {

    if (!certificateId) {

        container.innerHTML = `

            <h2>
                ❌ شهادة غير موجودة
            </h2>

        `;

        return;

    }


    db.collection("certificates")

        .where(
            "certificateId",
            "==",
            certificateId
        )

        .limit(1)

        .get()

        .then(function(snapshot) {

            if (
                snapshot.empty
            ) {

                container.innerHTML = `

                    <h2>
                        ❌ الشهادة غير موجودة
                    </h2>

                    <p>
                        Certificate ID غير صحيح.
                    </p>

                `;

                return;

            }


            const data =
                snapshot.docs[0].data();


            const valid =
                data.status ===
                "valid";


            container.innerHTML = `

                <div class="logo">

                    🩺 بوابة التمريض

                </div>


                <div class="title">

                    Certificate of Completion

                </div>


                <div class="subtitle">

                    تشهد بوابة التمريض بأن

                </div>


                <div class="student-name">

                    ${escapeHtml(
                        data.studentName
                    )}

                </div>


                <div class="subtitle">

                    قد أتم بنجاح

                </div>


                <div class="course">

                    ${escapeHtml(
                        data.subject
                    )}

                    -

                    ${escapeHtml(
                        data.chapter
                    )}

                </div>


                <div class="score">

                    🏆 الدرجة النهائية:

                    <strong>

                        ${escapeHtml(
                            data.score
                        )}%

                    </strong>

                </div>


                <div class="details">

                    <div>

                        📅 تاريخ الإصدار:

                        <br>

                        <strong>

                            ${formatDate(
                                data.issuedAt
                            )}

                        </strong>

                    </div>


                    <div>

                        🔐 Certificate ID:

                        <br>

                        <strong>

                            ${escapeHtml(
                                data.certificateId
                            )}

                        </strong>

                    </div>

                </div>


                <div class="status ${
                    valid
                        ? "valid"
                        : "invalid"
                }">

                    ${
                        valid
                            ? "✅ شهادة صالحة"
                            : "❌ الشهادة ملغاة"
                    }

                </div>


                <div class="verify">

                    يمكن التحقق من صحة هذه الشهادة
                    باستخدام رقم الشهادة.

                </div>


                <div class="actions">

                    <button
                        onclick="window.print()">

                        🖨️ طباعة / حفظ PDF

                    </button>

                </div>

            `;

        })

        .catch(function(error) {

            console.error(
                error
            );

            container.innerHTML = `

                <h2>

                    ❌ حدث خطأ

                </h2>

                <p>

                    تعذر تحميل الشهادة.

                </p>

            `;

        });

}


loadCertificate();

</script>

</body>

</html>
