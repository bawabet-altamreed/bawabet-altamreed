<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Health Nursing | Chapter 1</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>📝 Community Health Nursing</h1>

<p>Chapter 1 Quiz</p>

</header>


<section class="years">

<div class="card">

<div class="timer">
⏳ <span id="timer">05:00</span>
</div>


<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>


<p id="questionNumber"></p>


<h2 id="question"></h2>


<div id="answers"></div>


<button id="nextBtn">
▶️ التالي
</button>

</div>

</section>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

// ==========================================
// بيانات الطالب
// ==========================================

const studentCode =
localStorage.getItem("studentCode");

const studentName =
localStorage.getItem("studentName");

const studentGrade =
localStorage.getItem("studentGrade");


// ==========================================
// التحقق من تسجيل الدخول
// ==========================================

if (!studentCode) {

    window.location.replace("login.html");

}


// ==========================================
// الأسئلة
// ==========================================

const questions = [

{

question:
"Community Health Nursing focuses mainly on:",

answers:[

"The whole community",

"Only hospital patients",

"Doctors only",

"Medical laboratories"

],

correct:0

},

{

question:
"According to WHO, health includes:",

answers:[

"Physical, mental and social well-being",

"Only absence of disease",

"Physical health only",

"Mental health only"

],

correct:0

},

{

question:
"Which organization defined Community Health Nursing?",

answers:[

"American Nursing Association (ANA)",

"UNICEF",

"WHO",

"Red Crescent"

],

correct:0

},

{

question:
"Primary prevention aims to:",

answers:[

"Prevent disease before it occurs",

"Treat disease",

"Reduce disability",

"Rehabilitation"

],

correct:0

},

{

question:
"One determinant of health is:",

answers:[

"Education",

"Hair color",

"Eye color",

"Favorite food"

],

correct:0

}

];


// ==========================================
// متغيرات الاختبار
// ==========================================

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = 300;

let timerInterval;

let examFinished = false;


// ==========================================
// عناصر الصفحة
// ==========================================

const questionElement =
document.getElementById("question");

const answersElement =
document.getElementById("answers");

const nextButton =
document.getElementById("nextBtn");

const timer =
document.getElementById("timer");


// ==========================================
// تحميل السؤال
// ==========================================

function loadQuestion(){

    answered = false;

    answersElement.innerHTML = "";

    nextButton.style.display = "none";


    const q =
    questions[currentQuestion];


    questionElement.innerHTML =
    q.question;


    document.getElementById(
        "questionNumber"
    ).innerHTML =
    "Question " +
    (currentQuestion + 1) +
    " / " +
    questions.length;


    document.getElementById(
        "progressBar"
    ).style.width =
    (
        (currentQuestion + 1) /
        questions.length
    ) * 100 + "%";


    q.answers.forEach(
        function(answer,index){

            const button =
            document.createElement("button");


            button.innerHTML =
            answer;


            button.className =
            "quiz-answer";


            button.onclick =
            function(){

                selectAnswer(
                    index,
                    button
                );

            };


            answersElement.appendChild(
                button
            );

        }
    );

}


// ==========================================
// اختيار الإجابة
// ==========================================

function selectAnswer(index,button){

    if(answered) return;

    answered = true;


    const buttons =
    answersElement.querySelectorAll(
        "button"
    );


    buttons.forEach(
        function(btn){

            btn.disabled = true;

        }
    );


    if(
        index ===
        questions[currentQuestion].correct
    ){

        score++;

        button.style.background =
        "green";

        button.style.color =
        "#fff";

    }

    else{

        button.style.background =
        "red";

        button.style.color =
        "#fff";


        buttons[
            questions[currentQuestion].correct
        ].style.background =
        "green";


        buttons[
            questions[currentQuestion].correct
        ].style.color =
        "#fff";

    }


    nextButton.style.display =
    "block";

}


// ==========================================
// زر التالي
// ==========================================

nextButton.onclick =
function(){

    if(!answered){

        alert(
            "Please select an answer first."
        );

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }

    else{

        finishExam();

    }

};


// ==========================================
// إنهاء الاختبار
// ==========================================

function finishExam(){

    if(examFinished) return;

    examFinished = true;


    clearInterval(
        timerInterval
    );


    const percentage =
    Math.round(
        (score / questions.length) * 100
    );


    saveResult(
        percentage
    );

}


// ==========================================
// حفظ النتيجة في Firestore
// ==========================================

function saveResult(percentage){

    if(!studentCode){

        alert(
            "❌ يجب تسجيل الدخول أولاً"
        );

        window.location.replace(
            "login.html"
        );

        return;

    }


    db.collection("results")
    .add({

        studentCode:
        studentCode,

        name:
        studentName || "",

        grade:
        studentGrade || "",

        subject:
        "Community Health Nursing",

        chapter:
        "Chapter 1",

        score:
        score,

        total:
        questions.length,

        percentage:
        percentage,

        date:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    })


    .then(
        function(){

            showResult(
                percentage
            );

        }
    )


    .catch(
        function(error){

            console.error(
                "Save Result Error:",
                error
            );


            alert(
                "❌ حدث خطأ أثناء حفظ النتيجة\n" +
                error.message
            );

        }
    );

}


// ==========================================
// عرض النتيجة
// ==========================================

function showResult(percentage){

    const card =
    document.querySelector(".card");


    let message = "";


    if(percentage >= 90){

        message =
        "🏆 Excellent! Great performance.";

    }

    else if(percentage >= 75){

        message =
        "👏 Well done! Excellent level.";

    }

    else if(percentage >= 50){

        message =
        "👍 Good. Review the chapter again.";

    }

    else{

        message =
        "📚 You need to review the chapter and try again.";

    }


    card.innerHTML = `

        <div class="result-box">

            <h2>
                🎉 Quiz Completed
            </h2>

            <p>
                Your Score
            </p>

            <h1>
                ${score} / ${questions.length}
            </h1>

            <h2>
                ${percentage}%
            </h2>

            <p>
                ${message}
            </p>

            <button
                onclick="location.reload()">
                🔄 Retry Quiz
            </button>

            <br><br>

            <button
                onclick="history.back()">
                🏠 Back
            </button>

        </div>

    `;

}


// ==========================================
// المؤقت
// ==========================================

function startTimer(){

    timerInterval =
    setInterval(
        function(){

            let minutes =
            Math.floor(
                timeLeft / 60
            );


            let seconds =
            timeLeft % 60;


            if(seconds < 10){

                seconds =
                "0" + seconds;

            }


            timer.innerHTML =
            "⏳ " +
            minutes +
            ":" +
            seconds;


            timeLeft--;


            if(timeLeft < 0){

                finishExam();

            }

        },
        1000
    );

}


// ==========================================
// تشغيل الاختبار
// ==========================================

loadQuestion();

startTimer();

</script>

</body>

</html>
