<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Health Nursing - Chapter 2 Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>📝 Community Health Nursing</h1>

<p>Chapter 2 Quiz</p>

</header>

<section class="years">

<div class="card">

<div class="timer">
⏳ <span id="timer">05:00</span>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<button id="nextBtn">
▶️ التالي
</button>

</div>

</section>

<script>

const questions=[

{
question:"Primary Health Care (PHC) is:",
answers:[
{text:"The first level of health care",correct:true},
{text:"Hospital surgery",correct:false},
{text:"Emergency care only",correct:false},
{text:"Laboratory services",correct:false}
]
},

{
question:"Which of the following is NOT a principle of PHC?",
answers:[
{text:"Luxury Care",correct:true},
{text:"Community Participation",correct:false},
{text:"Appropriate Technology",correct:false},
{text:"Equitable Distribution",correct:false}
]
},

{
question:"How many main components does PHC have?",
answers:[
{text:"3",correct:true},
{text:"2",correct:false},
{text:"5",correct:false},
{text:"7",correct:false}
]
},

{
question:"Community participation means:",
answers:[
{text:"People share in improving health",correct:true},
{text:"Doctors work alone",correct:false},
{text:"Hospitals only",correct:false},
{text:"Ignoring families",correct:false}
]
},

{
question:"One element of PHC is:",
answers:[
{text:"Health Education",correct:true},
{text:"Cosmetic Surgery",correct:false},
{text:"Luxury Treatment",correct:false},
{text:"Space Medicine",correct:false}
]
},

{
question:"Maternal and Child Health aims to improve:",
answers:[
{text:"Health of mothers and children",correct:true},
{text:"Only elderly people",correct:false},
{text:"Animals only",correct:false},
{text:"Factories",correct:false}
]
},

{
question:"Vaccination is part of:",
answers:[
{text:"Primary Health Care",correct:true},
{text:"Road Safety",correct:false},
{text:"Bank Services",correct:false},
{text:"Engineering",correct:false}
]
},

{
question:"A Community Health Nurse provides:",
answers:[
{text:"Health Education",correct:true},
{text:"Building Houses",correct:false},
{text:"Driving Ambulances Only",correct:false},
{text:"Selling Medicines",correct:false}
]
},

{
question:"Safe Water and Sanitation are:",
answers:[
{text:"Elements of PHC",correct:true},
{text:"Hospital Departments",correct:false},
{text:"Types of Diseases",correct:false},
{text:"Medicines",correct:false}
]
},

{
question:"The best answer about PHC is:",
answers:[
{text:"Promotes health and prevents disease",correct:true},
{text:"Treats diseases only",correct:false},
{text:"Works only in hospitals",correct:false},
{text:"For children only",correct:false}
]
}

];

let currentQuestion=0;
let score=0;

let timeLeft=300;

const timer=document.getElementById("timer");

const questionElement=document.getElementById("question");
const answersElement=document.getElementById("answers");
const nextButton=document.getElementById("nextBtn");

const countdown=setInterval(function(){

if(timeLeft<=0){

showResult();

return;

}

timeLeft--;

let minutes=Math.floor(timeLeft/60);
let seconds=timeLeft%60;

timer.innerHTML=
String(minutes).padStart(2,"0")+":"+String(seconds).padStart(2,"0");

},1000);

function showQuestion(){

resetState();

document.getElementById("progressBar").style.width=((currentQuestion+1)/questions.length)*100+"%";

let q=questions[currentQuestion];

questionElement.innerHTML=(currentQuestion+1)+". "+q.question;

q.answers.forEach(answer=>{

const button=document.createElement("button");

button.innerHTML=answer.text;

button.onclick=()=>selectAnswer(answer.correct,button);

answersElement.appendChild(button);

});

}

function resetState(){

nextButton.style.display="none";

answersElement.innerHTML="";

}

function selectAnswer(correct,button){

if(correct){

score++;

button.style.background="green";

}else{

button.style.background="red";

}

Array.from(answersElement.children).forEach(btn=>btn.disabled=true);

nextButton.style.display="block";

}

nextButton.onclick=function(){

currentQuestion++;

if(currentQuestion<questions.length){

showQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(countdown);

let percentage=Math.round((score/questions.length)*100);

let message="";

if(percentage>=90){

message="🏆 ممتاز! أداء رائع.";

}

else if(percentage>=75){

message="👏 أحسنت، مستواك ممتاز.";

}

else if(percentage>=50){

message="👍 جيد، راجع الشابتر مرة أخرى.";

}

else{

message="📚 تحتاج إلى مراجعة الشابتر ثم إعادة الاختبار.";

}

document.querySelector(".card").innerHTML=`

<div class="result-box">

<h2>🎉 انتهى الاختبار</h2>

<p>النتيجة</p>

<h1>${score} / ${questions.length}</h1>

<h2>${percentage}%</h2>

<p>${message}</p>

<button onclick="location.reload()">🔄 إعادة الاختبار</button>

<br><br>

<button onclick="history.back()">🏠 العودة للشابتر</button>

</div>

`;

}

showQuestion();

</script>
<script src="auth.js"></script>
</body>

</html>
