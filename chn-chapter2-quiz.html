<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Health Nursing - Chapter 2 Quiz</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>📝 Community Health Nursing</h1>

<p>Chapter 2 Quiz</p>

</header>


<section class="years">

<div class="card">

<div class="timer">
⏳ <span id="timer">05:00</span>
</div>


<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>


<p id="questionNumber"></p>


<h2 id="question"></h2>


<div id="answers"></div>


<button id="nextBtn">
▶️ التالي
</button>

</div>

</section>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

// ==========================================
// بيانات الطالب
// ==========================================

const studentCode =
localStorage.getItem("studentCode");

const studentName =
localStorage.getItem("studentName");

const studentGrade =
localStorage.getItem("studentGrade");


// ==========================================
// التحقق من تسجيل الدخول
// ==========================================

if (!studentCode) {

    window.location.replace("login.html");

}


// ==========================================
// الأسئلة
// ==========================================

const questions = [

{
question:"Primary Health Care (PHC) is:",
answers:[
"The first level of health care",
"Hospital surgery",
"Emergency care only",
"Laboratory services"
],
correct:0
},

{
question:"Which of the following is NOT a principle of PHC?",
answers:[
"Luxury Care",
"Community Participation",
"Appropriate Technology",
"Equitable Distribution"
],
correct:0
},

{
question:"How many main components does PHC have?",
answers:[
"3",
"2",
"5",
"7"
],
correct:0
},

{
question:"Community participation means:",
answers:[
"People share in improving health",
"Doctors work alone",
"Hospitals only",
"Ignoring families"
],
correct:0
},

{
question:"One element of PHC is:",
answers:[
"Health Education",
"Cosmetic Surgery",
"Luxury Treatment",
"Space Medicine"
],
correct:0
},

{
question:"Maternal and Child Health aims to improve:",
answers:[
"Health of mothers and children",
"Only elderly people",
"Animals only",
"Factories"
],
correct:0
},

{
question:"Vaccination is part of:",
answers:[
"Primary Health Care",
"Road Safety",
"Bank Services",
"Engineering"
],
correct:0
},

{
question:"A Community Health Nurse provides:",
answers:[
"Health Education",
"Building Houses",
"Driving Ambulances Only",
"Selling Medicines"
],
correct:0
},

{
question:"Safe Water and Sanitation are:",
answers:[
"Elements of PHC",
"Hospital Departments",
"Types of Diseases",
"Medicines"
],
correct:0
},

{
question:"The best answer about PHC is:",
answers:[
"Promotes health and prevents disease",
"Treats diseases only",
"Works only in hospitals",
"For children only"
],
correct:0
}

];


// ==========================================
// متغيرات الاختبار
// ==========================================

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = 300;

let timerInterval;

let examFinished = false;


// ==========================================
// عناصر الصفحة
// ==========================================

const questionElement =
document.getElementById("question");

const answersElement =
document.getElementById("answers");

const nextButton =
document.getElementById("nextBtn");

const timer =
document.getElementById("timer");


// ==========================================
// تحميل السؤال
// ==========================================

function loadQuestion(){

    answered = false;

    answersElement.innerHTML = "";

    nextButton.style.display = "none";


    const q =
    questions[currentQuestion];


    questionElement.innerHTML =
    q.question;


    document.getElementById(
        "questionNumber"
    ).innerHTML =
    "Question " +
    (currentQuestion + 1) +
    " / " +
    questions.length;


    document.getElementById(
        "progressBar"
    ).style.width =
    (
        (currentQuestion + 1) /
        questions.length
    ) * 100 + "%";


    q.answers.forEach(
        function(answer,index){

            const button =
            document.createElement("button");


            button.innerHTML =
            answer;


            button.className =
            "quiz-answer";


            button.onclick =
            function(){

                selectAnswer(
                    index,
                    button
                );

            };


            answersElement.appendChild(
                button
            );

        }
    );

}


// ==========================================
// اختيار الإجابة
// ==========================================

function selectAnswer(index,button){

    if(answered) return;

    answered = true;


    const buttons =
    answersElement.querySelectorAll(
        "button"
    );


    buttons.forEach(
        function(btn){

            btn.disabled = true;

        }
    );


    if(
        index ===
        questions[currentQuestion].correct
    ){

        score++;

        button.style.background =
        "green";

        button.style.color =
        "#fff";

    }

    else{

        button.style.background =
        "red";

        button.style.color =
        "#fff";


        buttons[
            questions[currentQuestion].correct
        ].style.background =
        "green";


        buttons[
            questions[currentQuestion].correct
        ].style.color =
        "#fff";

    }


    nextButton.style.display =
    "block";

}


// ==========================================
// زر التالي
// ==========================================

nextButton.onclick =
function(){

    if(!answered){

        alert(
            "من فضلك اختر إجابة أولاً"
        );

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        loadQuestion();

    }

    else{

        finishExam();

    }

};


// ==========================================
// إنهاء الاختبار
// ==========================================

function finishExam(){

    if(examFinished) return;

    examFinished = true;


    clearInterval(
        timerInterval
    );


    const percentage =
    Math.round(
        (score / questions.length) * 100
    );


    saveResult(
        percentage
    );

}


// ==========================================
// حفظ النتيجة
// ==========================================

function saveResult(percentage){

    if(!studentCode){

        alert(
            "❌ يجب تسجيل الدخول أولاً"
        );

        window.location.replace(
            "login.html"
        );

        return;

    }


    db.collection("results")
    .add({

        studentCode:
        studentCode,

        name:
        studentName || "",

        grade:
        studentGrade || "",

        subject:
        "Community Health Nursing",

        chapter:
        "Chapter 2",

        score:
        score,

        total:
        questions.length,

        percentage:
        percentage,

        date:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    })


    .then(
        function(){

            showResult(
                percentage
            );

        }
    )


    .catch(
        function(error){

            console.error(
                "Save Result Error:",
                error
            );


            alert(
                "❌ حدث خطأ أثناء حفظ النتيجة\n" +
                error.message
            );

        }
    );

}


// ==========================================
// عرض النتيجة
// ==========================================

function showResult(percentage){

    const card =
    document.querySelector(".card");


    let message = "";


    if(percentage >= 90){

        message =
        "🏆 ممتاز! أداء رائع.";

    }

    else if(percentage >= 75){

        message =
        "👏 أحسنت، مستواك ممتاز.";

    }

    else if(percentage >= 50){

        message =
        "👍 جيد، راجع الشابتر مرة أخرى.";

    }

    else{

        message =
        "📚 تحتاج إلى مراجعة الشابتر ثم إعادة الاختبار.";

    }


    card.innerHTML = `

        <div class="result-box">

            <h2>
                🎉 انتهى الاختبار
            </h2>

            <p>
                النتيجة
            </p>

            <h1>
                ${score} / ${questions.length}
            </h1>

            <h2>
                ${percentage}%
            </h2>

            <p>
                ${message}
            </p>

            <button
                onclick="location.reload()">
                🔄 إعادة الاختبار
            </button>

            <br><br>

            <button
                onclick="history.back()">
                🏠 العودة للشابتر
            </button>

        </div>

    `;

}


// ==========================================
// المؤقت
// ==========================================

function startTimer(){

    timerInterval =
    setInterval(
        function(){

            let minutes =
            Math.floor(
                timeLeft / 60
            );


            let seconds =
            timeLeft % 60;


            if(seconds < 10){

                seconds =
                "0" + seconds;

            }


            timer.innerHTML =
            "⏳ " +
            minutes +
            ":" +
            seconds;


            timeLeft--;


            if(timeLeft < 0){

                finishExam();

            }

        },
        1000
    );

}


// ==========================================
// تشغيل الاختبار
// ==========================================

loadQuestion();

startTimer();

</script>

</body>

</html>
