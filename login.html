<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | بوابة التمريض</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<div class="logo">🩺</div>

<h2>بوابة التمريض</h2>

<p>سجل الدخول للمتابعة</p>

<div class="input-box">
<span class="icon">🔑</span>
<input type="text" id="code" placeholder="كود الاشتراك">
</div>

<div class="input-box">
<span class="icon">🔒</span>
<input type="password" id="password" placeholder="كلمة المرور">
</div>

<button id="loginBtn" onclick="login()">
تسجيل الدخول
</button>

<br><br>

<p>
إذا لم يكن لديك كود اشتراك، تواصل مع إدارة بوابة التمريض.
</p>

<div class="footer">
© 2026 بوابة التمريض
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script>

let isLoggingIn = false;

function login(){

if(isLoggingIn){
return;
}

const code =
document.getElementById("code").value.trim();

const password =
document.getElementById("password").value.trim();

const loginBtn =
document.getElementById("loginBtn");


if(code === "" || password === ""){

alert("من فضلك أدخل كود الاشتراك وكلمة المرور");

return;

}


// منع الضغط المتكرر

isLoggingIn = true;

loginBtn.disabled = true;

loginBtn.innerHTML =
"⏳ جاري تسجيل الدخول...";


db.collection("students")
.doc(code)
.get()

.then(function(doc){

if(!doc.exists){

throw new Error(
"❌ كود الاشتراك غير صحيح"
);

}


const student = doc.data();


// كلمة المرور

if(student.password !== password){

throw new Error(
"❌ كلمة المرور غير صحيحة"
);

}


// الاشتراك مفعل؟

if(student.active !== true){

throw new Error(
"❌ هذا الاشتراك غير مفعل"
);

}


// تاريخ الانتهاء

if(student.expiresAt){

let expiry;

if(
typeof student.expiresAt.toDate === "function"
){

expiry =
student.expiresAt.toDate();

}else{

expiry =
new Date(student.expiresAt);

}


if(isNaN(expiry.getTime())){

throw new Error(
"❌ تاريخ انتهاء الاشتراك غير صحيح"
);

}


if(new Date() >= expiry){

throw new Error(
"❌ انتهى اشتراكك، يرجى تجديد الاشتراك"
);

}

}


// إنشاء Device ID

let deviceId =
localStorage.getItem("deviceId");


if(!deviceId){

deviceId =
"device_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2,10);

localStorage.setItem(
"deviceId",
deviceId
);

}


// أول جهاز

if(
!student.deviceId ||
student.deviceId === "null" ||
student.deviceId === ""
){

return db.collection("students")
.doc(code)
.update({

deviceId: deviceId

})

.then(function(){

return student;

});

}


// نفس الجهاز

if(student.deviceId === deviceId){

return student;

}


// جهاز آخر

throw new Error(
"❌ هذا الاشتراك مستخدم على جهاز آخر"
);

})

.then(function(student){

// حفظ بيانات الطالب

localStorage.setItem(
"studentCode",
code
);

localStorage.setItem(
"studentName",
student.name || ""
);

localStorage.setItem(
"studentGrade",
student.grade || ""
);


// الدخول

window.location.replace(
"index.html"
);

})

.catch(function(error){

console.log(error);

alert(error.message);

isLoggingIn = false;

loginBtn.disabled = false;

loginBtn.innerHTML =
"تسجيل الدخول";

});

}

</script>

</body>

</html>
