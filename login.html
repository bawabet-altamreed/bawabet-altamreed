<!-- ==========================
     Firebase
========================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>



<script>


// ==========================================
// حالة تسجيل الدخول
// ==========================================

let isLoggingIn = false;



// ==========================================
// إنشاء / الحصول على Device ID
// ==========================================

function getDeviceId() {

    let deviceId =
        localStorage.getItem("deviceId");


    // ======================================
    // الجهاز لديه Device ID بالفعل
    // ======================================

    if (deviceId) {

        return deviceId;

    }


    // ======================================
    // إنشاء Device ID جديد
    // ======================================

    try {

        if (
            window.crypto &&
            typeof window.crypto.randomUUID ===
            "function"
        ) {

            deviceId =
                "device_" +
                window.crypto.randomUUID();

        }

        else {

            deviceId =
                "device_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 12);

        }

    }

    catch (error) {

        deviceId =
            "device_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 12);

    }


    // ======================================
    // حفظ Device ID
    // ======================================

    localStorage.setItem(
        "deviceId",
        deviceId
    );


    return deviceId;

}



// ==========================================
// التحقق من Device ID
// ==========================================

function isValidDeviceId(value) {

    return (
        value &&
        value !== "null" &&
        value !== ""
    );

}



// ==========================================
// تسجيل الدخول
// ==========================================

function login() {


    // ======================================
    // منع الضغط المتكرر
    // ======================================

    if (isLoggingIn) {

        return;

    }


    // ======================================
    // الحصول على البيانات
    // ======================================

    const code =
        document
            .getElementById("code")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value
            .trim();


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    // ======================================
    // التحقق من البيانات
    // ======================================

    if (!code || !password) {

        alert(
            "من فضلك أدخل كود الاشتراك وكلمة المرور"
        );

        return;

    }


    // ======================================
    // بدء تسجيل الدخول
    // ======================================

    isLoggingIn = true;

    loginBtn.disabled = true;

    loginBtn.innerHTML =
        "⏳ جاري تسجيل الدخول...";


    // ======================================
    // Anonymous Authentication
    // ======================================

    let authPromise;


    if (
        firebase.auth().currentUser
    ) {

        authPromise =
            Promise.resolve(
                firebase.auth().currentUser
            );

    }

    else {

        authPromise =
            firebase.auth()
                .signInAnonymously();

    }



    // ======================================
    // بعد Authentication
    // ======================================

    authPromise

        .then(function () {


            // ==================================
            // أولاً نبحث عن الطالب
            // ==================================

            return db
                .collection("students")
                .doc(code)
                .get();

        })


        // ==========================================
        // تحديد نوع الحساب
        // ==========================================

        .then(function (studentDoc) {


            // ==================================
            // الحساب طالب
            // ==================================

            if (
                studentDoc.exists
            ) {


                const student =
                    studentDoc.data();


                // ==================================
                // كلمة المرور
                // ==================================

                if (
                    student.password !==
                    password
                ) {

                    throw new Error(
                        "❌ كلمة المرور غير صحيحة"
                    );

                }


                // ==================================
                // حالة الاشتراك
                // ==================================

                if (
                    student.active !== true
                ) {

                    throw new Error(
                        "❌ هذا الاشتراك غير مفعل"
                    );

                }


                // ==================================
                // تاريخ انتهاء الاشتراك
                // ==================================

                if (
                    student.expiresAt
                ) {


                    let expiry;


                    if (
                        typeof
                        student.expiresAt.toDate ===
                        "function"
                    ) {

                        expiry =
                            student.expiresAt.toDate();

                    }

                    else {

                        expiry =
                            new Date(
                                student.expiresAt
                            );

                    }


                    if (
                        isNaN(
                            expiry.getTime()
                        )
                    ) {

                        throw new Error(
                            "❌ تاريخ انتهاء الاشتراك غير صحيح"
                        );

                    }


                    if (
                        new Date() >=
                        expiry
                    ) {

                        throw new Error(
                            "❌ انتهى اشتراكك، يرجى تجديد الاشتراك"
                        );

                    }

                }



                // ==================================
                // Device ID
                // الطالب
                // ==================================

                const deviceId =
                    getDeviceId();



                // ==================================
                // أول جهاز للطالب
                // ==================================

                if (
                    !isValidDeviceId(
                        student.deviceId
                    )
                ) {


                    return db
                        .collection("students")
                        .doc(code)
                        .update({

                            deviceId:
                                deviceId

                        })

                        .then(function () {


                            // تحديث البيانات
                            student.deviceId =
                                deviceId;


                            return {

                                type:
                                    "student",

                                data:
                                    student

                            };

                        });

                }



                // ==================================
                // نفس جهاز الطالب
                // ==================================

                if (
                    student.deviceId ===
                    deviceId
                ) {


                    return {

                        type:
                            "student",

                        data:
                            student

                    };

                }



                // ==================================
                // جهاز آخر
                // ==================================

                throw new Error(
                    "❌ هذا الاشتراك مستخدم على جهاز آخر"
                );

            }



            // ==========================================
            // ليس طالبًا
            // نبحث عن ولي الأمر
            // ==========================================

            return db
                .collection("parents")
                .doc(code)
                .get()

                .then(function (parentDoc) {


                    // ==================================
                    // الكود غير موجود
                    // ==================================

                    if (
                        !parentDoc.exists
                    ) {

                        throw new Error(
                            "❌ كود الاشتراك غير صحيح"
                        );

                    }


                    const parent =
                        parentDoc.data();



                    // ==================================
                    // كلمة المرور
                    // ==================================

                    if (
                        parent.password !==
                        password
                    ) {

                        throw new Error(
                            "❌ كلمة المرور غير صحيحة"
                        );

                    }



                    // ==================================
                    // حالة الحساب
                    // ==================================

                    if (
                        parent.active !== true
                    ) {

                        throw new Error(
                            "❌ حساب ولي الأمر غير مفعل"
                        );

                    }



                    // ==================================
                    // كود الطالب المرتبط
                    // ==================================

                    if (
                        !parent.studentCode
                    ) {

                        throw new Error(
                            "❌ لم يتم ربط حساب ولي الأمر بالطالب"
                        );

                    }



                    // ==================================
                    // تاريخ انتهاء الحساب
                    // ==================================

                    if (
                        parent.expiresAt
                    ) {


                        let expiry;


                        if (
                            typeof
                            parent.expiresAt.toDate ===
                            "function"
                        ) {

                            expiry =
                                parent.expiresAt.toDate();

                        }

                        else {

                            expiry =
                                new Date(
                                    parent.expiresAt
                                );

                        }


                        if (
                            isNaN(
                                expiry.getTime()
                            )
                        ) {

                            throw new Error(
                                "❌ تاريخ انتهاء اشتراك ولي الأمر غير صحيح"
                            );

                        }


                        if (
                            new Date() >=
                            expiry
                        ) {

                            throw new Error(
                                "❌ انتهى اشتراك ولي الأمر"
                            );

                        }

                    }



                    // ==================================
                    // Device ID
                    // ولي الأمر
                    // ==================================

                    const deviceId =
                        getDeviceId();



                    // ==================================
                    // أول جهاز لولي الأمر
                    // ==================================

                    if (
                        !isValidDeviceId(
                            parent.deviceId
                        )
                    ) {


                        return db
                            .collection("parents")
                            .doc(code)
                            .update({

                                deviceId:
                                    deviceId

                            })

                            .then(function () {


                                // تحديث البيانات
                                parent.deviceId =
                                    deviceId;


                                // نتحقق من الطالب
                                return db
                                    .collection("students")
                                    .doc(
                                        parent.studentCode
                                    )
                                    .get();

                            })

                            .then(function (
                                studentDoc
                            ) {


                                if (
                                    !studentDoc.exists
                                ) {

                                    throw new Error(
                                        "❌ الطالب المرتبط بحساب ولي الأمر غير موجود"
                                    );

                                }


                                const student =
                                    studentDoc.data();


                                return {

                                    type:
                                        "parent",

                                    data:
                                        parent,

                                    student:
                                        student

                                };

                            });

                    }



                    // ==================================
                    // نفس جهاز ولي الأمر
                    // ==================================

                    if (
                        parent.deviceId ===
                        deviceId
                    ) {


                        return db
                            .collection("students")
                            .doc(
                                parent.studentCode
                            )
                            .get()

                            .then(function (
                                studentDoc
                            ) {


                                if (
                                    !studentDoc.exists
                                ) {

                                    throw new Error(
                                        "❌ الطالب المرتبط بحساب ولي الأمر غير موجود"
                                    );

                                }


                                const student =
                                    studentDoc.data();


                                return {

                                    type:
                                        "parent",

                                    data:
                                        parent,

                                    student:
                                        student

                                };

                            });

                    }



                    // ==================================
                    // جهاز آخر
                    // ==================================

                    throw new Error(
                        "❌ هذا الحساب مستخدم على جهاز آخر"
                    );

                });

        })



        // ==========================================
        // نجاح تسجيل الدخول
        // ==========================================

        .then(function (result) {


            // ==================================
            // الطالب
            // ==================================

            if (
                result.type ===
                "student"
            ) {


                const student =
                    result.data;


                // ----------------------------------
                // نوع الحساب
                // ----------------------------------

                localStorage.setItem(
                    "accountType",
                    "student"
                );


                // ----------------------------------
                // كود الطالب
                // ----------------------------------

                localStorage.setItem(
                    "studentCode",
                    code
                );


                // ----------------------------------
                // اسم الطالب
                // ----------------------------------

                localStorage.setItem(
                    "studentName",
                    student.name || ""
                );


                // ----------------------------------
                // الصف
                // ----------------------------------

                localStorage.setItem(
                    "studentGrade",
                    student.grade || ""
                );


                // ----------------------------------
                // Device ID
                // ----------------------------------

                localStorage.setItem(
                    "deviceId",
                    student.deviceId ||
                    getDeviceId()
                );


                // ----------------------------------
                // إزالة بيانات ولي الأمر القديمة
                // ----------------------------------

                localStorage.removeItem(
                    "parentCode"
                );

                localStorage.removeItem(
                    "parentName"
                );


                // ----------------------------------
                // الدخول للمنصة
                // ----------------------------------

                window.location.replace(
                    "index.html"
                );

                return;

            }



            // ==================================
            // ولي الأمر
            // ==================================

            if (
                result.type ===
                "parent"
            ) {


                const parent =
                    result.data;


                // ----------------------------------
                // نوع الحساب
                // ----------------------------------

                localStorage.setItem(
                    "accountType",
                    "parent"
                );


                // ----------------------------------
                // كود ولي الأمر
                // ----------------------------------

                localStorage.setItem(
                    "parentCode",
                    code
                );


                // ----------------------------------
                // كود الطالب
                // ----------------------------------

                localStorage.setItem(
                    "studentCode",
                    parent.studentCode
                );


                // ----------------------------------
                // اسم ولي الأمر
                // ----------------------------------

                localStorage.setItem(
                    "parentName",
                    parent.name || ""
                );


                // ----------------------------------
                // Device ID
                // ----------------------------------

                localStorage.setItem(
                    "deviceId",
                    parent.deviceId ||
                    getDeviceId()
                );


                // ----------------------------------
                // إزالة بيانات الطالب القديمة
                // ----------------------------------

                localStorage.removeItem(
                    "studentName"
                );

                localStorage.removeItem(
                    "studentGrade"
                );


                // ----------------------------------
                // الدخول إلى Dashboard ولي الأمر
                // ----------------------------------

                window.location.replace(
                    "parent.html"
                );

                return;

            }



            // ==================================
            // نوع حساب غير معروف
            // ==================================

            throw new Error(
                "❌ نوع الحساب غير معروف"
            );

        })



        // ==========================================
        // معالجة الأخطاء
        // ==========================================

        .catch(function (error) {


            console.error(
                "Login Error:",
                error
            );


            alert(
                error.message ||
                "❌ حدث خطأ أثناء تسجيل الدخول"
            );


            // ==================================
            // إعادة زر الدخول
            // ==================================

            isLoggingIn =
                false;


            loginBtn.disabled =
                false;


            loginBtn.innerHTML =
                "تسجيل الدخول";

        });

}



// ==========================================
// زر تسجيل الدخول
// ==========================================

document
    .getElementById("loginBtn")
    .addEventListener(
        "click",
        login
    );



// ==========================================
// الضغط على Enter
// ==========================================

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function (event) {


            if (
                event.key ===
                "Enter"
            ) {

                login();

            }

        }
    );


</script>


</body>
