<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<title>تسجيل الدخول | بوابة التمريض</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<div class="logo">🩺</div>

<h2>بوابة التمريض</h2>

<p>سجل الدخول للمتابعة</p>


<div class="input-box">

<span class="icon">🔑</span>

<input
type="text"
id="code"
placeholder="كود الاشتراك"
autocomplete="off">

</div>


<div class="input-box">

<span class="icon">🔒</span>

<input
type="password"
id="password"
placeholder="كلمة المرور">

</div>


<button id="loginBtn" type="button">
تسجيل الدخول
</button>


<br><br>

<p>
إذا لم يكن لديك كود اشتراك، تواصل مع إدارة بوابة التمريض.
على واتساب 01222736904
</p>


<div class="footer">
© 2026 بوابة التمريض
</div>

</div>


<!-- ==========================
     Firebase
========================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>


<script>

let isLoggingIn = false;


// ==========================================
// تسجيل الدخول
// ==========================================

function login() {

    if (isLoggingIn) {
        return;
    }


    const code =
        document.getElementById("code")
            .value
            .trim();


    const password =
        document.getElementById("password")
            .value
            .trim();


    const loginBtn =
        document.getElementById("loginBtn");


    // ==========================================
    // التحقق من البيانات
    // ==========================================

    if (!code || !password) {

        alert(
            "من فضلك أدخل كود الاشتراك وكلمة المرور"
        );

        return;

    }


    isLoggingIn = true;

    loginBtn.disabled = true;

    loginBtn.innerHTML =
        "⏳ جاري تسجيل الدخول...";


    // ==========================================
    // Anonymous Authentication
    // ==========================================

    let authPromise;


    if (firebase.auth().currentUser) {

        authPromise =
            Promise.resolve(
                firebase.auth().currentUser
            );

    }

    else {

        authPromise =
            firebase.auth()
                .signInAnonymously();

    }


    // ==========================================
    // بعد Authentication
    // ==========================================

    authPromise

        .then(function () {

            // ==================================
            // أولاً نبحث عن الطالب
            // ==================================

            return db.collection("students")
                .doc(code)
                .get();

        })


        // ==========================================
        // تحديد نوع الحساب
        // ==========================================

        .then(function (studentDoc) {

            // ==================================
            // الحساب طالب
            // ==================================

            if (studentDoc.exists) {

                const student =
                    studentDoc.data();


                // ----------------------------------
                // كلمة المرور
                // ----------------------------------

                if (
                    student.password !== password
                ) {

                    throw new Error(
                        "❌ كلمة المرور غير صحيحة"
                    );

                }


                // ----------------------------------
                // حالة الاشتراك
                // ----------------------------------

                if (
                    student.active !== true
                ) {

                    throw new Error(
                        "❌ هذا الاشتراك غير مفعل"
                    );

                }


                // ----------------------------------
                // تاريخ انتهاء الاشتراك
                // ----------------------------------

                if (student.expiresAt) {

                    let expiry;


                    if (
                        typeof student.expiresAt.toDate ===
                        "function"
                    ) {

                        expiry =
                            student.expiresAt.toDate();

                    }

                    else {

                        expiry =
                            new Date(
                                student.expiresAt
                            );

                    }


                    if (
                        isNaN(
                            expiry.getTime()
                        )
                    ) {

                        throw new Error(
                            "❌ تاريخ انتهاء الاشتراك غير صحيح"
                        );

                    }


                    if (
                        new Date() >= expiry
                    ) {

                        throw new Error(
                            "❌ انتهى اشتراكك، يرجى تجديد الاشتراك"
                        );

                    }

                }


                // ==================================
                // Device ID للطالب فقط
                // ==================================

                let deviceId =
                    localStorage.getItem(
                        "deviceId"
                    );


                if (!deviceId) {

                    deviceId =
                        "device_" +
                        Date.now() +
                        "_" +
                        Math.random()
                            .toString(36)
                            .substring(2, 10);


                    localStorage.setItem(
                        "deviceId",
                        deviceId
                    );

                }


                // ==================================
                // أول جهاز
                // ==================================

                if (
                    !student.deviceId ||
                    student.deviceId === "null" ||
                    student.deviceId === ""
                ) {

                    return db.collection("students")
                        .doc(code)
                        .update({

                            deviceId:
                                deviceId

                        })

                        .then(function () {

                            return {

                                type:
                                    "student",

                                data:
                                    student

                            };

                        });

                }


                // ==================================
                // نفس الجهاز
                // ==================================

                if (
                    student.deviceId === deviceId
                ) {

                    return {

                        type:
                            "student",

                        data:
                            student

                    };

                }


                // ==================================
                // جهاز آخر
                // ==================================

                throw new Error(
                    "❌ هذا الاشتراك مستخدم على جهاز آخر"
                );

            }


            // ==========================================
            // ليس طالبًا
            // نبحث في parents
            // ==========================================

            return db.collection("parents")
                .doc(code)
                .get()

                .then(function (parentDoc) {

                    if (!parentDoc.exists) {

                        throw new Error(
                            "❌ كود الاشتراك غير صحيح"
                        );

                    }


                    const parent =
                        parentDoc.data();


                    // ----------------------------------
                    // كلمة المرور
                    // ----------------------------------

                    if (
                        parent.password !== password
                    ) {

                        throw new Error(
                            "❌ كلمة المرور غير صحيحة"
                        );

                    }


                    // ----------------------------------
                    // حالة الحساب
                    // ----------------------------------

                    if (
                        parent.active !== true
                    ) {

                        throw new Error(
                            "❌ حساب ولي الأمر غير مفعل"
                        );

                    }


                    // ----------------------------------
                    // التأكد من وجود الطالب
                    // ----------------------------------

                    if (
                        !parent.studentCode
                    ) {

                        throw new Error(
                            "❌ لم يتم ربط حساب ولي الأمر بالطالب"
                        );

                    }


                    // ----------------------------------
                    // تاريخ انتهاء الحساب
                    // ----------------------------------

                    if (parent.expiresAt) {

                        let expiry;


                        if (
                            typeof parent.expiresAt.toDate ===
                            "function"
                        ) {

                            expiry =
                                parent.expiresAt.toDate();

                        }

                        else {

                            expiry =
                                new Date(
                                    parent.expiresAt
                                );

                        }


                        if (
                            isNaN(
                                expiry.getTime()
                            )
                        ) {

                            throw new Error(
                                "❌ تاريخ انتهاء اشتراك ولي الأمر غير صحيح"
                            );

                        }


                        if (
                            new Date() >= expiry
                        ) {

                            throw new Error(
                                "❌ انتهى اشتراك ولي الأمر"
                            );

                        }

                    }


                    // ==================================
                    // نتأكد أن الطالب المرتبط موجود
                    // ==================================

                    return db.collection("students")
                        .doc(parent.studentCode)
                        .get()

                        .then(function (studentDoc) {

                            if (!studentDoc.exists) {

                                throw new Error(
                                    "❌ الطالب المرتبط بحساب ولي الأمر غير موجود"
                                );

                            }


                            const student =
                                studentDoc.data();


                            return {

                                type:
                                    "parent",

                                data:
                                    parent,

                                student:
                                    student

                            };

                        });

                });

        })


        // ==========================================
        // نجاح تسجيل الدخول
        // ==========================================

        .then(function (result) {

            // ==================================
            // طالب
            // ==================================

            if (
                result.type === "student"
            ) {

                const student =
                    result.data;


                // نوع الحساب

                localStorage.setItem(
                    "accountType",
                    "student"
                );


                // كود الطالب

                localStorage.setItem(
                    "studentCode",
                    code
                );


                // اسم الطالب

                localStorage.setItem(
                    "studentName",
                    student.name || ""
                );


                // الصف

                localStorage.setItem(
                    "studentGrade",
                    student.grade || ""
                );


                // إزالة بيانات ولي الأمر القديمة

                localStorage.removeItem(
                    "parentCode"
                );


                // الدخول للمنصة

                window.location.replace(
                    "index.html"
                );

                return;

            }


            // ==================================
            // ولي الأمر
            // ==================================

            if (
                result.type === "parent"
            ) {

                const parent =
                    result.data;


                // نوع الحساب

                localStorage.setItem(
                    "accountType",
                    "parent"
                );


                // كود ولي الأمر

                localStorage.setItem(
                    "parentCode",
                    code
                );


                // كود الطالب

                localStorage.setItem(
                    "studentCode",
                    parent.studentCode
                );


                // اسم ولي الأمر

                localStorage.setItem(
                    "parentName",
                    parent.name || ""
                );


                // إزالة بيانات الطالب القديمة

                localStorage.removeItem(
                    "studentName"
                );

                localStorage.removeItem(
                    "studentGrade"
                );


                // الدخول إلى Dashboard ولي الأمر

                window.location.replace(
                    "parent.html"
                );

                return;

            }


            throw new Error(
                "❌ نوع الحساب غير معروف"
            );

        })


        // ==========================================
        // معالجة الأخطاء
        // ==========================================

        .catch(function (error) {

            console.error(
                "Login Error:",
                error
            );


            alert(
                error.message ||
                "❌ حدث خطأ أثناء تسجيل الدخول"
            );


            isLoggingIn = false;

            loginBtn.disabled = false;

            loginBtn.innerHTML =
                "تسجيل الدخول";

        });

}


// ==========================================
// زر تسجيل الدخول
// ==========================================

document
    .getElementById("loginBtn")
    .addEventListener(
        "click",
        login
    );


// ==========================================
// الضغط على Enter
// ==========================================

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                login();

            }

        }
    );

</script>

</body>

</html>
