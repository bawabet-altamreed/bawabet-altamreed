<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical-Surgical Nursing - Chapter 2 Quiz</title>

<link rel="stylesheet" href="style.css">


<!-- ========================================== -->
<!-- Firebase -->
<!-- ========================================== -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- ========================================== -->
<!-- Firebase Configuration -->
<!-- ========================================== -->

<script src="firebase.js"></script>

</head>


<body>


<!-- ========================================== -->
<!-- Header -->
<!-- ========================================== -->

<header>

<h1>🩺 Medical-Surgical Nursing</h1>

<p>
Chapter 2 - Perioperative Care Quiz
</p>

</header>



<!-- ========================================== -->
<!-- Quiz -->
<!-- ========================================== -->

<section class="years">

<div class="card">


<!-- ========================================== -->
<!-- Timer -->
<!-- ========================================== -->

<div class="timer">

⏳ <span id="timer">05:00</span>

</div>



<!-- ========================================== -->
<!-- Progress -->
<!-- ========================================== -->

<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>



<!-- ========================================== -->
<!-- Question -->
<!-- ========================================== -->

<h2 id="question"></h2>



<!-- ========================================== -->
<!-- Answers -->
<!-- ========================================== -->

<div id="answers"></div>



<!-- ========================================== -->
<!-- Next Button -->
<!-- ========================================== -->

<button id="nextBtn">

▶️ التالي

</button>


</div>

</section>



<script>


// ==================================================
// بوابة التمريض
// Medical-Surgical Nursing - Chapter 2 Quiz
// ==================================================


// ==================================================
// Firebase Authentication
// ==================================================

let currentUser = null;


// ==================================================
// منع حفظ النتيجة أكثر من مرة
// ==================================================

let examFinished = false;


// ==================================================
// التحقق من تسجيل الدخول
// ==================================================

firebase.auth().onAuthStateChanged(function(user){

    if(user){

        currentUser = user;

        console.log(
            "Logged in:",
            user.email
        );

    }

    else{

        window.location.replace(
            "login.html"
        );

    }

});



// ==================================================
// Questions
// ==================================================

const questions = [

{
question:
"Perioperative nursing includes which three phases?",

answers:[

{
text:"Assessment, Diagnosis and Treatment",
correct:false
},

{
text:"Preoperative, Intraoperative and Postoperative",
correct:true
},

{
text:"Admission, Surgery and Discharge",
correct:false
},

{
text:"Planning, Surgery and Rehabilitation",
correct:false
}

]
},


{

question:
"The preoperative phase begins when:",

answers:[

{
text:"The patient enters the recovery room",
correct:false
},

{
text:"The patient receives anesthesia",
correct:false
},

{
text:"The decision for surgical intervention is made",
correct:true
},

{
text:"The surgical wound is closed",
correct:false
}

]

},


{

question:
"Which type of surgery requires immediate attention to maintain life?",

answers:[

{
text:"Elective surgery",
correct:false
},

{
text:"Optional surgery",
correct:false
},

{
text:"Required surgery",
correct:false
},

{
text:"Emergent surgery",
correct:true
}

]

},


{

question:
"A biopsy is an example of which type of surgery according to purpose?",

answers:[

{
text:"Diagnostic surgery",
correct:true
},

{
text:"Palliative surgery",
correct:false
},

{
text:"Aesthetic surgery",
correct:false
},

{
text:"Reconstructive surgery",
correct:false
}

]

},


{

question:
"Which nursing action is an important part of preoperative preparation?",

answers:[

{
text:"Allowing the patient to eat immediately before surgery",
correct:false
},

{
text:"Ignoring the patient's questions",
correct:false
},

{
text:"Explaining the procedure and answering questions",
correct:true
},

{
text:"Preventing communication with the healthcare team",
correct:false
}

]

},


{

question:
"What is the main purpose of informed consent?",

answers:[

{
text:"To replace the nursing assessment",
correct:false
},

{
text:"To give permission for a specific procedure",
correct:true
},

{
text:"To guarantee that complications will not occur",
correct:false
},

{
text:"To determine the patient's discharge date",
correct:false
}

]

},


{

question:
"Which nurse is responsible for maintaining the sterile field and passing instruments to the surgeon?",

answers:[

{
text:"Circulating nurse",
correct:false
},

{
text:"Nursing assistant",
correct:false
},

{
text:"Scrub nurse",
correct:true
},

{
text:"Recovery room nurse",
correct:false
}

]

},


{

question:
"Which position is commonly used for spinal surgery?",

answers:[

{
text:"Lithotomy",
correct:false
},

{
text:"Trendelenburg",
correct:false
},

{
text:"Lateral",
correct:false
},

{
text:"Prone",
correct:true
}

]

},


{

question:
"Which of the following is a principle of surgical asepsis?",

answers:[

{
text:"Sterile articles may touch any surface",
correct:false
},

{
text:"Sterile equipment should be kept below the waist",
correct:false
},

{
text:"Sterile articles should touch only sterile articles or surfaces",
correct:true
},

{
text:"Unnecessary traffic around the sterile area should be encouraged",
correct:false
}

]

},


{

question:
"Which intervention helps prevent postoperative pulmonary complications?",

answers:[

{
text:"Encouraging deep breathing, coughing and early ambulation",
correct:true
},

{
text:"Keeping the patient completely immobile",
correct:false
},

{
text:"Restricting all fluids",
correct:false
},

{
text:"Avoiding respiratory exercises",
correct:false
}

]

}

];



// ==================================================
// Quiz Variables
// ==================================================

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = 300;

let timerInterval = null;



// ==================================================
// Page Elements
// ==================================================

const questionElement =
document.getElementById("question");


const answersElement =
document.getElementById("answers");


const nextButton =
document.getElementById("nextBtn");


const progressBar =
document.getElementById("progressBar");


const timerElement =
document.getElementById("timer");



// ==================================================
// Show Question
// ==================================================

function showQuestion(){

    if(examFinished)
        return;


    answered = false;


    answersElement.innerHTML = "";


    nextButton.style.display =
    "none";


    const q =
    questions[currentQuestion];


    questionElement.innerHTML =
    (currentQuestion + 1) +
    ". " +
    q.question;


    progressBar.style.width =
    (
        ((currentQuestion + 1) /
        questions.length) * 100
    ) + "%";


    q.answers.forEach(function(answer){

        const button =
        document.createElement("button");


        button.type =
        "button";


        button.innerHTML =
        answer.text;


        button.className =
        "quiz-answer";


        button.onclick =
        function(){

            selectAnswer(
                answer.correct,
                button
            );

        };


        answersElement.appendChild(
            button
        );

    });

}



// ==================================================
// Select Answer
// ==================================================

function selectAnswer(correct, button){

    if(answered || examFinished)
        return;


    answered = true;


    const buttons =
    Array.from(
        answersElement.children
    );


    buttons.forEach(function(btn){

        btn.disabled = true;

    });


    if(correct){

        score++;


        button.style.background =
        "green";


        button.style.color =
        "#fff";

    }

    else{

        button.style.background =
        "red";


        button.style.color =
        "#fff";


        const correctIndex =
        questions[currentQuestion]
        .answers
        .findIndex(function(answer){

            return answer.correct === true;

        });


        if(correctIndex !== -1){

            buttons[
                correctIndex
            ].style.background =
            "green";


            buttons[
                correctIndex
            ].style.color =
            "#fff";

        }

    }


    nextButton.style.display =
    "block";

}



// ==================================================
// Next Button
// ==================================================

nextButton.onclick =
function(){

    if(examFinished)
        return;


    if(!answered){

        alert(
            "من فضلك اختر إجابة أولاً"
        );

        return;

    }


    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        showQuestion();

    }

    else{

        finishExam();

    }

};



// ==================================================
// Finish Exam
// ==================================================

function finishExam(){

    if(examFinished)
        return;


    examFinished = true;


    clearInterval(
        timerInterval
    );


    const percentage =
    Math.round(
        (score /
        questions.length) * 100
    );


    disableQuiz();


    saveResult(
        percentage
    );

}



// ==================================================
// Time Up
// ==================================================

function timeUp(){

    if(examFinished)
        return;


    examFinished = true;


    clearInterval(
        timerInterval
    );


    const percentage =
    Math.round(
        (score /
        questions.length) * 100
    );


    disableQuiz();


    alert(
        "⏰ انتهى الوقت!"
    );


    saveResult(
        percentage
    );

}



// ==================================================
// Disable Quiz
// ==================================================

function disableQuiz(){

    const buttons =
    answersElement.querySelectorAll(
        "button"
    );


    buttons.forEach(function(button){

        button.disabled = true;

    });


    nextButton.disabled = true;

}



// ==================================================
// Save Result
// ==================================================

function saveResult(percentage){

    if(!currentUser){

        showResult(
            percentage
        );

        return;

    }


    db.collection("users")

    .doc(currentUser.uid)

    .get()

    .then(function(doc){

        if(!doc.exists){

            throw new Error(
                "بيانات الطالب غير موجودة"
            );

        }


        const userData =
        doc.data();


        return db.collection("results")

        .add({

            uid:
            currentUser.uid,

            studentCode:
            userData.studentCode || "",

            name:
            userData.name || "",

            grade:
            userData.grade || "",

            email:
            currentUser.email || "",

            subject:
            "Medical-Surgical Nursing",

            chapter:
            "Chapter 2",

            score:
            score,

            total:
            questions.length,

            percentage:
            percentage,

            date:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        });

    })

    .then(function(){

        showResult(
            percentage
        );

    })

    .catch(function(error){

        console.error(
            "Save Result Error:",
            error
        );


        alert(
            "❌ حدث خطأ أثناء حفظ النتيجة، ولكن سيتم عرض النتيجة."
        );


        showResult(
            percentage
        );

    });

}



// ==================================================
// Show Result
// ==================================================

function showResult(percentage){

    questionElement.innerHTML =
    "🎉 انتهى الاختبار";


    progressBar.style.width =
    "100%";


    let message;


    if(percentage >= 90){

        message =
        "🏆 ممتاز! أداء رائع.";

    }

    else if(percentage >= 75){

        message =
        "👏 أحسنت، مستواك ممتاز.";

    }

    else if(percentage >= 50){

        message =
        "👍 جيد، راجع الشابتر مرة أخرى.";

    }

    else{

        message =
        "📚 تحتاج إلى مراجعة الشابتر ثم إعادة الاختبار.";

    }


    answersElement.innerHTML = `

        <div class="result-box">

            <p>
                النتيجة
            </p>


            <h1>
                ${score} / ${questions.length}
            </h1>


            <h2>
                ${percentage}%
            </h2>


            <p>
                ${message}
            </p>


            <button
            type="button"
            onclick="location.reload()">

                🔄 إعادة الاختبار

            </button>


            <br><br>


            <button
            type="button"
            onclick="history.back()">

                🏠 العودة للشابتر

            </button>

        </div>

    `;


    nextButton.style.display =
    "none";

}



// ==================================================
// Timer
// ==================================================

function updateTimer(){

    const minutes =
    Math.floor(
        timeLeft / 60
    );


    const seconds =
    timeLeft % 60;


    const formattedMinutes =
    String(minutes)
    .padStart(2,"0");


    const formattedSeconds =
    String(seconds)
    .padStart(2,"0");


    timerElement.innerHTML =
    "⏱️ الوقت: " +
    formattedMinutes +
    ":" +
    formattedSeconds;

}



// ==================================================
// Start Timer
// ==================================================

function startTimer(){

    updateTimer();


    timerInterval =
    setInterval(function(){

        if(examFinished){

            clearInterval(
                timerInterval
            );

            return;

        }


        timeLeft--;


        if(timeLeft <= 0){

            timeLeft = 0;


            updateTimer();


            timeUp();


            return;

        }


        updateTimer();

    },1000);

}



// ==================================================
// Start Quiz
// ==================================================

showQuestion();

startTimer();


</script>



<!-- ========================================== -->
<!-- Authentication -->
<!-- ========================================== -->

<script src="auth.js"></script>


</body>

</html>
